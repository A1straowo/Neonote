name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --no-pub

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Build universal APK
        run: flutter build apk --release --no-pub

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Neonote-${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/Neonote-${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/Neonote-${VERSION}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Neonote-${VERSION}-universal.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Neonote-*-arm64-v8a.apk
            dist/Neonote-*-armeabi-v7a.apk
            dist/Neonote-*-x86_64.apk
            dist/Neonote-*-universal.apk
            dist/SHA256SUMS.txt